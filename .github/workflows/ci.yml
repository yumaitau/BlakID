name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Version comes from package.json "packageManager". Do not also pass version.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit
      - run: node scripts/scan-secrets.mjs --history
      - run: node scripts/check-authentik-pin.mjs
      - run: pnpm audit --audit-level=high
      - run: pnpm dlx @cyclonedx/cyclonedx-npm --output-file sbom.cdx.json --omit dev
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pin
        run: node -e "const fs=require('fs'); const t=fs.readFileSync('packages/config/src/index.ts','utf8'); const d=t.match(/sha256:[a-f0-9]{64}/)[0]; fs.appendFileSync(process.env.GITHUB_OUTPUT, 'digest='+d+'\n')"
      # v0.36.0 commit. Immutable release. Do not use a floating tag.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ghcr.io/goauthentik/server@${{ steps.pin.outputs.digest }}
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker info
      - run: pnpm test:integration
